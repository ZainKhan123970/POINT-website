<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POINT — Admin Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap');
:root{--ink:#111;--gold:#cda34b;--paper:#f4f1e9;--muted:#68707a;--line:#d9d5cc}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",Arial,sans-serif}
.login-shell{width:min(100%,900px);min-height:100vh;margin:0 auto;padding:56px 42px 28px;display:flex;flex-direction:column;align-items:center}
.login-brand{width:min(100%,575px);display:flex;align-items:center;gap:18px;margin-bottom:42px}
.brand-mark{font-family:Oswald,sans-serif;font-size:42px;font-weight:700;letter-spacing:1px}.brand-line{width:52px;height:2px;background:var(--gold)}.brand-label{font-weight:700;letter-spacing:3px;color:#686868;font-size:14px}
.login-card{width:min(100%,575px);background:#fff;border:1px solid var(--line);padding:64px 54px 56px;box-shadow:13px 13px 0 rgba(207,201,188,.45)}
.eyebrow{margin:0 0 8px;font-weight:700;letter-spacing:2.5px;color:#69717a;font-size:14px}
h1{font-family:Oswald,sans-serif;font-size:82px;line-height:.88;letter-spacing:-1px;margin:0 0 26px}h1 em{font-style:normal;color:var(--gold)}
.login-copy{font-size:18px;line-height:1.6;color:#69717a;margin:0 0 28px;max-width:460px}
label{display:block;font-size:14px;font-weight:700;margin-bottom:19px}input{display:block;width:100%;height:52px;margin-top:9px;border:1px solid #cfcac0;background:#fbfaf7;padding:0 15px;font:600 15px "DM Sans",sans-serif;outline:none}input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(205,163,75,.14)}
.password-requirements{margin:-6px 0 22px;padding:12px 14px;border-left:2px solid var(--gold);background:#faf8f2;color:#666;font-size:13px;line-height:1.75}.requirements-title{font-weight:700;color:#222;margin-bottom:2px}.requirement{display:flex;gap:8px}.requirement span{color:var(--gold);font-weight:800}
.primary-btn{width:100%;height:54px;border:0;background:#111;color:#fff;font:700 17px "DM Sans",sans-serif;cursor:pointer}.primary-btn:hover{background:#222}.primary-btn span{margin-left:8px}
.auth-switch{text-align:center;margin:18px 0 0;color:#68707a;font-size:14px}.auth-switch a{color:#111;font-weight:700;text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:2px}
.form-message{min-height:20px;margin:10px 0 0;color:#c33;font-size:13px}
footer{width:min(100%,575px);margin-top:38px;font-size:12px;letter-spacing:1px;color:#777}
@media(max-width:650px){.login-shell{padding:32px 18px}.login-brand{margin-bottom:28px}.login-card{padding:42px 25px 38px}.brand-mark{font-size:34px}h1{font-size:62px}.login-copy{font-size:16px}}
</style>
</head>
<body>
<main class="login-shell">
<div class="login-brand"><span class="brand-mark">POINT</span><span class="brand-line"></span><span class="brand-label">CONTROL ROOM</span></div>
<section class="login-card">
<p class="eyebrow">PRIVATE ACCESS</p>
<h1>Manage the<br><em>drop.</em></h1>
<p class="login-copy">Sign in to manage products, prices, stock and featured pieces.</p>
<form id="loginForm">
<label>Email<input id="email" type="email" autocomplete="email" required></label>
<label>Password<input id="password" type="password" autocomplete="current-password" required></label>
<div class="password-requirements"><div class="requirements-title">Password must contain:</div><div class="requirement"><span>✓</span> At least 8 characters</div><div class="requirement"><span>✓</span> 1 uppercase letter</div><div class="requirement"><span>✓</span> 1 number</div><div class="requirement"><span>✓</span> 1 special character</div></div>
<button class="primary-btn" type="submit">Sign in <span>↗</span></button>
<p class="auth-switch">New admin? <a href="signup.html">Create an account</a></p>
<p id="loginMessage" class="form-message" role="alert"></p>
</form>
</section>
<footer>POINT © 2026 · ADMIN</footer>
</main>
<script>
const SUPABASE_URL = "https://pudjdblduksbttlwhvyz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Iv_8FrGP_XZ96QjRo5tzcw_-udsNuzL";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
document.getElementById("loginForm").addEventListener("submit", async (e) => {
 e.preventDefault();
 const msg=document.getElementById("loginMessage"); msg.textContent="";
 const {error}=await supabaseClient.auth.signInWithPassword({
   email:document.getElementById("email").value.trim(),
   password:document.getElementById("password").value
 });
 if(error){msg.textContent=error.message;return;}
 window.location.href="dashboard.html";
});
</script>
</body>
</html>
